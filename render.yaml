# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service built from the root Dockerfile. Redeploys on every push to main.
services:
  - type: web
    name: bondmind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
