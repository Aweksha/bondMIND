name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bondmind
          POSTGRES_PASSWORD: bondmind
          POSTGRES_DB: bondmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bondmind" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      BONDMIND_DATABASE_URL: postgresql+psycopg://bondmind:bondmind@localhost:5432/bondmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Seed snapshot matches generator (determinism)
        run: python -m app.seed.generate && git diff --exit-code -- ../data/seed
      - name: Migrations apply and match models
        run: alembic upgrade head && alembic check
      - name: Seed load is idempotent
        run: python -m app.seed.load && python -m app.seed.load | grep -q "Nothing to load"
      - name: Tests (SQLite)
        run: pytest
        env:
          BONDMIND_DATABASE_URL: "sqlite+pysqlite:///:memory:"
      - name: Tests (PostgreSQL)
        run: |
          PGPASSWORD=bondmind psql -h localhost -U bondmind -c "create database bondmind_test"
          BONDMIND_DATABASE_URL=postgresql+psycopg://bondmind:bondmind@localhost:5432/bondmind_test pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npx ng build
      - run: npx ng test --watch=false

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8080/api/v1/health
      - run: curl -fsS http://localhost:8080/ | grep -q "bondMIND"
      - if: always()
        run: docker compose logs && docker compose down -v
