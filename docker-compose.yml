name: bondmind

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bondmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bondmind}
      POSTGRES_DB: bondmind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bondmind -d bondmind"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      BONDMIND_DATABASE_URL: postgresql+psycopg://bondmind:${POSTGRES_PASSWORD:-bondmind}@db:5432/bondmind
      BONDMIND_CORS_ORIGINS: '["http://localhost:4200","http://localhost:8080"]'
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 20

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:80"]

volumes:
  pgdata:
